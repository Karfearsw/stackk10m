<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta property="og:title" content="Luxe RM - Wholesaler CRM" />
    <meta property="og:description" content="Relationship management for real estate investors. Streamline your deal flow." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/luxe-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@replit" />
    <meta name="twitter:title" content="Luxe RM" />
    <meta name="twitter:description" content="Relationship management for real estate investors." />
    <meta name="twitter:image" content="/luxe-logo.png" />

    <meta name="theme-color" content="#000000" />

    <style>
      /* Pre-JS boot splash: seashell logo pulse instead of a blank screen. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        z-index: 9999;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.94); }
      }
    </style>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"><div id="boot-splash" aria-hidden="true"><img src="/luxe-logo.png" alt="" /></div></div>
    <script>
      // Remove the splash the moment React renders anything into #root.
      new MutationObserver(function (_, obs) {
        var splash = document.getElementById("boot-splash");
        if (splash && document.getElementById("root").childElementCount > 1) {
          splash.remove();
          obs.disconnect();
        }
      }).observe(document.getElementById("root"), { childList: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
