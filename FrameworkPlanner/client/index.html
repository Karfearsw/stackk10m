<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Luxe RM - Wholesaler CRM" />
    <meta property="og:description" content="Relationship management for real estate investors. Streamline your deal flow." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/luxe-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@replit" />
    <meta name="twitter:title" content="Luxe RM" />
    <meta name="twitter:description" content="Relationship management for real estate investors." />
    <meta name="twitter:image" content="/luxe-logo.png" />

    <meta name="theme-color" content="#141414" />

    <script>
      // Pre-paint theme resolution — must run before first render to avoid a flash.
      // Matches next-themes' storage key and class behavior (attribute="class", "dark").
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") {
            document.documentElement.classList.toggle("dark", t === "dark");
          }
        } catch (e) {}
        var dark = document.documentElement.classList.contains("dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#141414" : "#ffffff");
      })();
    </script>

    <style>
      /* Pre-JS boot splash: seashell logo pulse instead of a blank screen.
         Follows the resolved theme so it never flashes the wrong background. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        z-index: 9999;
      }
      html:not(.dark) #boot-splash {
        background: #ffffff;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.94); }
      }
    </style>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"><div id="boot-splash" aria-hidden="true"><img src="/luxe-logo.png" alt="" /></div></div>
    <script>
      // Remove the splash the moment React renders anything into #root.
      new MutationObserver(function (_, obs) {
        var splash = document.getElementById("boot-splash");
        if (splash && document.getElementById("root").childElementCount > 1) {
          splash.remove();
          obs.disconnect();
        }
      }).observe(document.getElementById("root"), { childList: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
